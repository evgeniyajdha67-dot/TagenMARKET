
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRKT | Gift Market</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101116;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    background: #17181f;
    border-bottom: 1px solid #292a32;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #a78bfa;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    color: #aaa;
    text-decoration: none;
}

nav a:hover {
    color: white;
}

.profile {
    background: #292a35;
    padding: 11px 18px;
    border-radius: 12px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px;
}

.hero {
    background: linear-gradient(120deg, #35245f, #171923);
    padding: 45px;
    border-radius: 22px;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: 36px;
    margin-bottom: 12px;
}

.hero p {
    color: #b5b2c6;
    margin-bottom: 22px;
}

.hero button {
    background: #9270f5;
    border: none;
    padding: 14px 25px;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}

.search {
    width: 100%;
    padding: 16px;
    background: #1c1d25;
    border: 1px solid #30313b;
    border-radius: 12px;
    color: white;
    margin-bottom: 25px;
    outline: none;
}

.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.category {
    padding: 11px 19px;
    background: #20212a;
    color: #aaa;
    border: 1px solid #30313b;
    border-radius: 10px;
    cursor: pointer;
}

.category.active,
.category:hover {
    background: #8060e8;
    color: white;
}

.section-title {
    font-size: 23px;
    margin-bottom: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.card {
    background: #1b1c24;
    border: 1px solid #2b2c35;
    border-radius: 16px;
    padding: 13px;
    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #8b6cf0;
}

.product-image {
    height: 160px;
    border-radius: 12px;
    background: linear-gradient(135deg, #30234f, #1c263c);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
    margin-bottom: 14px;
}

.card h3 {
    font-size: 16px;
    margin-bottom: 10px;
}

.price {
    color: #a78bfa;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 13px;
}

.buy {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: #8060e8;
    color: white;
    cursor: pointer;
}

.buy:hover {
    background: #987df5;
}

.empty {
    color: #999;
    grid-column: 1 / -1;
    padding: 30px 0;
}

footer {
    text-align: center;
    padding: 35px;
    color: #777;
    margin-top: 50px;
    border-top: 1px solid #292a32;
}

@media(max-width: 800px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }

    nav {
        display: none;
    }

    .hero h1 {
        font-size: 27px;
    }

    .hero {
        padding: 28px;
    }
}

@media(max-width: 400px) {
    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MRKT</div>

    <nav>
        <a href="#">Главная</a>
        <a href="#catalog">Каталог</a>
        <a href="#favorites">Избранное</a>
    </nav>

    <div class="profile">👤 Профиль</div>
</header>

<div class="container">

    <section class="hero">
        <h1>Telegram Gifts Marketplace</h1>
        <p>Открывай коллекционные подарки и цифровые коллекции.</p>
        <button onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">
            Смотреть подарки
        </button>
    </section>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 Поиск подарков..."
    >

    <div class="categories">
        <button class="category active" data-category="Все">Все</button>
        <button class="category" data-category="Подарки">Подарки</button>
        <button class="category" data-category="NFT">NFT</button>
        <button class="category" data-category="Коллекции">Коллекции</button>
    </div>

    <section id="catalog">
        <h2 class="section-title">🔥 Популярные подарки</h2>
        <div class="products" id="products"></div>
    </section>

</div>

<footer>
    MRKT MARKET © 2026
    <br><br>
    Демонстрационный маркетплейс
</footer>

<script>
const items = [
    {name: "Plush Pepe", price: 150, emoji: "🐸", category: "Подарки"},
    {name: "Durov's Cap", price: 90, emoji: "🧢", category: "Подарки"},
    {name: "Star Notepad", price: 50, emoji: "📒", category: "Коллекции"},
    {name: "Diamond Ring", price: 250, emoji: "💍", category: "NFT"},
    {name: "Toy Bear", price: 120, emoji: "🧸", category: "Подарки"},
    {name: "Magic Potion", price: 80, emoji: "🧪", category: "NFT"},
    {name: "Golden Star", price: 200, emoji: "⭐", category: "Коллекции"},
    {name: "Crystal Ball", price: 175, emoji: "🔮", category: "NFT"}
];

let activeCategory = "Все";

function renderProducts() {
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = items.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(search);
        const matchesCategory =
            activeCategory === "Все" ||
            item.category === activeCategory;

        return matchesSearch && matchesCategory;
    });

    const container = document.getElementById("products");

    if (filtered.length === 0) {
        container.innerHTML = '<p class="empty">Ничего не найдено</p>';
        return;
    }

    container.innerHTML = filtered.map(item => `
        <div class="card">
            <div class="product-image">${item.emoji}</div>
            <h3>${item.name}</h3>
            <div class="price">${item.price} ⭐</div>
            <button class="buy" onclick="showProduct('${item.name}')">
                Подробнее
            </button>
        </div>
    `).join("");
}

function showProduct(name) {
    alert("Вы выбрали: " + name + "\\nДемонстрационный товар.");
}

document.getElementById("search").addEventListener("input", renderProducts);

document.querySelectorAll(".category").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelector(".category.active").classList.remove("active");
        button.classList.add("active");
        activeCategory = button.dataset.category;
        renderProducts();
    });
});

renderProducts();
</script>

</body>
</html>
